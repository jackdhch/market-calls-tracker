name: on-push
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency: on-push
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20  # 要和上一次提交比，找出这次新增的推送文件
      - run: python3 scripts/on_push.py "${{ github.event.before }}"
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: 保存最新价格
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add data/prices.json
          git diff --cached --quiet || (git commit -m "更新价格" && git pull --rebase && git push)
